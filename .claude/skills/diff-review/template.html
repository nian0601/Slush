<title><!-- PAGE_TITLE --></title>
<style>
	:root{
		--bg:#F6F5F1;
		--surface:#FFFFFF;
		--surface-raised:#FCFBF8;
		--surface-2:#EDEBE4;
		--border:#DEDAD0;
		--text:#211F1A;
		--text-dim:#726C5F;
		--text-faint:#AFA99C;
		--accent:#B0551E;
		--accent-soft:#F1DCC8;
		--add-bg:#E3F3E7;
		--add-bg-strong:#CFEBD7;
		--add-text:#1B6B3D;
		--add-num:#5A9C74;
		--del-bg:#FBEAEA;
		--del-bg-strong:#F7D6D6;
		--del-text:#A32E2E;
		--del-num:#C77373;
		--shadow: 0 1px 2px rgba(30,25,15,0.06), 0 6px 20px -8px rgba(30,25,15,0.12);
	}
	@media (prefers-color-scheme: dark){
		:root{
			--bg:#17161B;
			--surface:#1E1C1E;
			--surface-raised:#242226;
			--surface-2:#2B292C;
			--border:#38353A;
			--text:#EEEAE1;
			--text-dim:#A29A97;
			--text-faint:#726C6E;
			--accent:#E2A059;
			--accent-soft:#3A2A22;
			--add-bg:rgba(66,163,105,0.16);
			--add-bg-strong:rgba(66,163,105,0.30);
			--add-text:#7AD79E;
			--add-num:#549A70;
			--del-bg:rgba(214,90,90,0.16);
			--del-bg-strong:rgba(214,90,90,0.30);
			--del-text:#F0A0A0;
			--del-num:#C9797D;
			--shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
		}
	}
	:root[data-theme="dark"]{
		--bg:#17161B; --surface:#1E1C1E; --surface-raised:#242226; --surface-2:#2B292C;
		--border:#38353A; --text:#EEEAE1; --text-dim:#A29A97; --text-faint:#726C6E;
		--accent:#E2A059; --accent-soft:#3A2A22;
		--add-bg:rgba(66,163,105,0.16); --add-bg-strong:rgba(66,163,105,0.30); --add-text:#7AD79E; --add-num:#549A70;
		--del-bg:rgba(214,90,90,0.16); --del-bg-strong:rgba(214,90,90,0.30); --del-text:#F0A0A0; --del-num:#C9797D;
		--shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
	}
	:root[data-theme="light"]{
		--bg:#F6F5F1; --surface:#FFFFFF; --surface-raised:#FCFBF8; --surface-2:#EDEBE4;
		--border:#DEDAD0; --text:#211F1A; --text-dim:#726C5F; --text-faint:#AFA99C;
		--accent:#B0551E; --accent-soft:#F1DCC8;
		--add-bg:#E3F3E7; --add-bg-strong:#CFEBD7; --add-text:#1B6B3D; --add-num:#5A9C74;
		--del-bg:#FBEAEA; --del-bg-strong:#F7D6D6; --del-text:#A32E2E; --del-num:#C77373;
		--shadow: 0 1px 2px rgba(30,25,15,0.06), 0 6px 20px -8px rgba(30,25,15,0.12);
	}

	*{box-sizing:border-box;}
	html,body{margin:0;padding:0;}
	body{
		background:var(--bg);
		color:var(--text);
		font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
		-webkit-font-smoothing:antialiased;
		overflow-x:hidden;
	}
	.mono{
		font-family:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
		tab-size:4;
	}

	.page{
		max-width:920px;
		margin:0 auto;
		padding:0 0 4rem;
	}

	/* ---------- top bar ---------- */
	.topbar{
		position:sticky;
		top:0;
		z-index:10;
		background:color-mix(in srgb, var(--bg) 88%, transparent);
		backdrop-filter:blur(10px);
		-webkit-backdrop-filter:blur(10px);
		border-bottom:1px solid var(--border);
		padding:.85rem 1.1rem .8rem;
	}
	.crumbs{
		font-size:.72rem;
		letter-spacing:.03em;
		color:var(--text-faint);
		display:flex;
		align-items:center;
		gap:.4rem;
		margin-bottom:.5rem;
		flex-wrap:wrap;
	}
	.crumbs .sep{opacity:.6}
	.crumbs .repo{color:var(--text-dim);font-weight:600}

	.topbar-row{
		display:flex;
		align-items:center;
		justify-content:space-between;
		gap:.75rem;
		flex-wrap:wrap;
	}
	.topbar-title{
		display:flex;
		align-items:baseline;
		gap:.65rem;
		flex-wrap:wrap;
	}
	h1{
		font-size:1.05rem;
		font-weight:700;
		margin:0;
		letter-spacing:-.01em;
	}
	.summary-stat{
		font-size:.8rem;
		color:var(--text-dim);
		white-space:nowrap;
	}
	.summary-stat .add{color:var(--add-text);font-weight:600}
	.summary-stat .del{color:var(--del-text);font-weight:600}

	.viewtoggle{
		display:inline-flex;
		border:1px solid var(--border);
		border-radius:7px;
		overflow:hidden;
		background:var(--surface);
		flex:0 0 auto;
	}
	.viewtoggle button{
		appearance:none;
		border:0;
		background:transparent;
		color:var(--text-dim);
		font:inherit;
		font-size:.74rem;
		font-weight:600;
		letter-spacing:.02em;
		padding:.42rem .7rem;
		cursor:pointer;
	}
	.viewtoggle button + button{border-left:1px solid var(--border);}
	.viewtoggle button[aria-pressed="true"]{
		background:var(--accent);
		color:#fff;
	}
	.viewtoggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}

	.linkbtn{
		appearance:none;
		border:1px solid var(--border);
		background:var(--surface);
		color:var(--text-dim);
		font:inherit;
		font-size:.74rem;
		font-weight:600;
		letter-spacing:.02em;
		padding:.42rem .7rem;
		border-radius:7px;
		cursor:pointer;
		flex:0 0 auto;
	}
	.linkbtn:hover{border-color:var(--accent);color:var(--accent);}
	.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}

	/* ---------- file cards ---------- */
	.files{
		display:flex;
		flex-direction:column;
		gap:1.1rem;
		padding:1.1rem;
	}
	.file{
		background:var(--surface);
		border:1px solid var(--border);
		border-radius:10px;
		box-shadow:var(--shadow);
		overflow:hidden;
	}
	.file__head{
		display:flex;
		align-items:center;
		justify-content:space-between;
		gap:.75rem;
		padding:.65rem .9rem;
		background:var(--surface-raised);
		flex-wrap:wrap;
		cursor:pointer;
		list-style:none;
		user-select:none;
	}
	.file__head::-webkit-details-marker{display:none;}
	.file__head::marker{content:none;}
	.file[open] > .file__head{border-bottom:1px solid var(--border);}
	.file__head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
	.file__head:hover{background:color-mix(in srgb, var(--surface-raised) 80%, var(--accent) 6%);}
	.file__head-left{
		display:flex;
		align-items:center;
		gap:.55rem;
		min-width:0;
	}
	.chev{
		display:inline-flex;
		flex:0 0 auto;
		color:var(--text-faint);
		transform:rotate(0deg);
		font-size:.7rem;
	}
	.file[open] > .file__head .chev{transform:rotate(90deg);}
	.file__path{
		font-size:.82rem;
		display:flex;
		align-items:baseline;
		gap:.15rem;
		min-width:0;
	}
	.file__path .dir{color:var(--text-faint);}
	.file__path .name{color:var(--text);font-weight:600;}
	.file__stats{
		font-size:.72rem;
		display:flex;
		align-items:center;
		gap:.55rem;
		white-space:nowrap;
	}
	.pill{
		display:inline-flex;
		gap:.35rem;
		padding:.15rem .5rem;
		border-radius:999px;
		background:var(--surface-2);
		font-weight:700;
		font-variant-numeric:tabular-nums;
	}
	.pill .add{color:var(--add-text);}
	.pill .del{color:var(--del-text);}
	.pill .note{color:var(--text-dim);font-weight:600;}

	.hunk__marker{
		font-size:.72rem;
		color:var(--text-faint);
		background:var(--surface-2);
		padding:.3rem .9rem;
		border-bottom:1px solid var(--border);
	}

	/* ---------- diff grids ---------- */
	.diff{font-size:.8rem;line-height:1.55;}
	.diff--split{
		display:grid;
		grid-template-columns:2.6em minmax(0,1fr) 2.6em minmax(0,1fr);
	}
	.diff--unified{
		display:grid;
		grid-template-columns:2.6em 2.6em minmax(0,1fr);
	}
	body[data-view="unified"] .diff--split{display:none;}
	body[data-view="split"] .diff--unified{display:none;}

	.num{
		text-align:right;
		padding:.15rem .55rem;
		color:var(--text-faint);
		user-select:none;
		font-variant-numeric:tabular-nums;
		border-right:1px solid var(--border);
	}
	.code{
		padding:.15rem .8rem;
		white-space:pre-wrap;
		word-break:break-word;
		min-width:0;
	}

	.num--empty{background:var(--surface-2);}
	.code--empty{
		background:repeating-linear-gradient(
			-45deg,
			var(--surface-2),
			var(--surface-2) 5px,
			color-mix(in srgb, var(--surface-2) 60%, var(--border)) 5px,
			color-mix(in srgb, var(--surface-2) 60%, var(--border)) 10px
		);
	}

	.num--del,.code--del{background:var(--del-bg);}
	.num--del{color:var(--del-num);border-right-color:var(--del-bg-strong);}
	.code--del{color:var(--del-text);}

	.num--add,.code--add{background:var(--add-bg);}
	.num--add{color:var(--add-num);border-right-color:var(--add-bg-strong);}
	.code--add{color:var(--add-text);}

	.marker{
		display:inline-block;
		width:1em;
		font-weight:700;
		user-select:none;
	}
	.marker--add{color:var(--add-num);}
	.marker--del{color:var(--del-num);}

	.filenote{
		padding:.9rem 1rem;
		font-size:.8rem;
		color:var(--text-dim);
	}

	/* ---------- footer note ---------- */
	.note{
		margin:1.4rem 1.1rem 0;
		font-size:.76rem;
		color:var(--text-faint);
		line-height:1.6;
		border-top:1px dashed var(--border);
		padding-top:1rem;
	}
	.note strong{color:var(--text-dim);}

	@media (prefers-reduced-motion:no-preference){
		.file{transition:box-shadow .15s ease;}
		.chev{transition:transform .15s ease;}
	}
</style>

<div class="page">
	<div class="topbar">
		<div class="crumbs">
			<!-- CRUMBS: e.g. repo name · scope description (e.g. "working tree", "HEAD~3..HEAD") · branch -->
		</div>
		<div class="topbar-row">
			<div class="topbar-title">
				<h1><!-- TITLE: e.g. "Uncommitted changes" or "issue-42 review" --></h1>
				<span class="summary-stat"><!-- SUMMARY_STAT: e.g. "3 files · +42 −11" --></span>
			</div>
			<div class="viewtoggle" role="group" aria-label="Diff view mode">
				<button type="button" id="btn-split" aria-pressed="false" onclick="setView('split')">Side-by-side</button>
				<button type="button" id="btn-unified" aria-pressed="false" onclick="setView('unified')">Unified</button>
			</div>
			<button type="button" id="btn-collapseall" class="linkbtn" onclick="toggleAllFiles()">Collapse all</button>
		</div>
	</div>

	<div class="files">
		<!-- FILES: one <details class="file" open>...</details> block per changed file, see SKILL.md -->
	</div>

	<p class="note"><!-- FOOTNOTE: brief note on what scope this diff covers --></p>
</div>

<script>
	function setView(mode){
		document.body.setAttribute('data-view', mode);
		document.getElementById('btn-split').setAttribute('aria-pressed', String(mode==='split'));
		document.getElementById('btn-unified').setAttribute('aria-pressed', String(mode==='unified'));
		try{ localStorage.setItem('diffViewMode', mode); }catch(e){}
	}
	(function init(){
		var saved = null;
		try{ saved = localStorage.getItem('diffViewMode'); }catch(e){}
		var mode = saved || (window.matchMedia('(min-width: 720px)').matches ? 'split' : 'unified');
		setView(mode);
	})();

	function allFiles(){
		return Array.prototype.slice.call(document.querySelectorAll('.file'));
	}
	function updateCollapseAllLabel(){
		var anyOpen = allFiles().some(function(f){ return f.open; });
		document.getElementById('btn-collapseall').textContent = anyOpen ? 'Collapse all' : 'Expand all';
	}
	function toggleAllFiles(){
		var anyOpen = allFiles().some(function(f){ return f.open; });
		allFiles().forEach(function(f){ f.open = !anyOpen; });
		updateCollapseAllLabel();
	}
	allFiles().forEach(function(f){
		f.addEventListener('toggle', updateCollapseAllLabel);
	});
	updateCollapseAllLabel();
</script>
